<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>row column</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
<body>
    <div class="container mt-5 border border-danger p-5" style="background-color: lightgray;">
        <div class="row">
            <div class="col bg-primary">1</div>
            <div class="col bg-success">2</div>
            <div class="col bg-warning">3</div>
            <div class="col bg-danger">4</div>
            <div class="col bg-info">5</div>
            <div class="col bg-light">6</div>
            <div class="col bg-dark">7</div>
            <div class="col bg-secondary">8</div>
            <div class="col border border-dark">9</div>
            <div class="col border border-danger">10</div>
            <div class="col border border-info">11</div>
            <div class="col border border-success">12</div>
        </div>
    </div>
</body>
</html>
