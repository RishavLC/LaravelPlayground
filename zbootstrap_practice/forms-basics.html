 <!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Form</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

<div class="container mt-4">
<form id="contactForm">

<!-- Full Name -->
<div class="row mb-3">
<label for="fullname" class="col-2 col-form-label">Full Name:</label>
<div class="col-4">
<input type="text" id="fullname" name="fullname" class="form-control" placeholder="Enter your name">
<span class="text-danger" id="nameError"></span>
</div>
</div>

<!-- Email -->
<div class="row mb-3">
<label for="email" class="col-2 col-form-label">Email:</label>
<div class="col-4">
<input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
</div>
</div>

<!-- Message -->
<div class="row mb-3">
<label for="message" class="col-2 col-form-label">Message:</label>
<div class="col-4">
<textarea id="message" name="message" class="form-control" rows="3"></textarea>
</div>
</div>

<!-- Country -->
<div class="row mb-3">
<label for="country" class="col-2 col-form-label">Country:</label>
<div class="col-4">
<select id="country" name="country" class="form-select">
<option value="">Select a country</option>
<option value="us">United States</option>
<option value="ca">Canada</option>
<option value="uk">United Kingdom</option>
</select>
</div>
</div>

<!-- Gender -->
<div class="row mb-3">
<label class="col-2 col-form-label">Gender:</label>
<div class="col-4">

<div class="form-check">
<input class="form-check-input" type="radio" id="male" name="gender" value="male">
<label class="form-check-label" for="male">Male</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" id="female" name="gender" value="female">
<label class="form-check-label" for="female">Female</label>
</div>

</div>
</div>

<!-- Terms -->
<div class="row mb-3">
<div class="col-2"></div>
<div class="col-4 form-check">
<input type="checkbox" id="terms" name="terms" class="form-check-input">
<label for="terms" class="form-check-label">
I agree to the terms and conditions
</label>
</div>
</div>

<button type="submit" class="btn btn-secondary">Submit</button>

</form>
</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){

let name = document.getElementById("fullname").value;

document.getElementById("nameError").innerHTML = "";

if(name === ""){
document.getElementById("nameError").innerHTML = "Name is required.";
e.preventDefault();
}

});
</script>

</body>
</html>
