<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Different Button</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-1">
                <button class="btn btn-primary">Click Button</button>
                <button class="btn btn-secondary">Click Button</button>
                <button class="btn btn-success border border-danger">Click Button</button>
                <button class="btn btn-danger mt-3 mb-3">Click Button</button>
                <button class="btn btn-warning" disabled>Click Button</button>
                <button class="btn btn-info pt-5">Click Button</button>  
                <button class="btn btn-light">Click Button</button>
                <button class="btn btn-dark">Click Button</button>
                <button class="btn btn-link mt-3" onclick="alert('hii');">Click Button</button>
                <button class="btn btn-outline-danger">Outline</button>
                <button class="btn btn-outline-primary">Outline</button>
                <button class="btn btn-primary btn-lg">large</button>
                <button class="btn btn-primary btn-sm">small</button>
                <button class="btn btn-primary btn-block">block</button>
                <button class="btn btn-primary">Default</button>
                hiii
            </div>
        </div>
    </div>
</body>
</html>
