<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div class="container">
        <h2 class="mb-4">Profile Modal Demo</h2>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#profileModal">
            Open Profile Modal
        </button>
    </div>

    <!-- Profile Modal -->
    <div class="modal fade" id="profileModal" tabindex="-1" aria-labelledby="profileModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <!-- Header with Profile Info -->
                <div class="modal-header bg-primary text-white">
                    <div class="d-flex align-items-center">
                        <img src="https://via.placeholder.com/60x60/007bff/ffffff?text=JD" alt="Profile" class="rounded-circle me-3">
                        <div>
                            <h5 class="modal-title mb-0" id="profileModalLabel">Rishav</h5>
                            <small class="opacity-75">rishav@gmail.com</small>
                        </div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-0">
                    <!-- Activity Section -->
                    <div class="border-bottom">
                        <h6 class="p-3 mb-0 bg-light">Recent Activity</h6>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Logged in</span>
                                <small class="text-muted">2 mins ago</small>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Updated profile</span>
                                <small class="text-muted">1 hour ago</small>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Purchased item</span>
                                <small class="text-muted">Yesterday</small>
                            </li>
                        </ul>
                    </div>

                    <!-- Settings Section -->
                    <div class="border-bottom">
                        <h6 class="p-3 mb-0 bg-light">Settings</h6>
                        <div class="list-group list-group-flush">
                            <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                Edit Profile
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                Notifications
                                <i class="bi bi-bell"></i>
                            </a>
                            <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                                Privacy Settings
                                <i class="bi bi-shield-lock"></i>
                            </a>
                        </div>
                    </div>

                    <!-- Account Section -->
                    <div class="border-bottom">
                        <h6 class="p-3 mb-0 bg-light">Account</h6>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">
                                <strong>Phone:</strong> +977-9746883728
                            </li>
                            <li class="list-group-item">
                                <strong>Member since:</strong> January 2026
                            </li>
                            <li class="list-group-item">
                                <strong>Plan:</strong> Premium
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" onclick="logout()">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                alert('Logged out successfully!');
            }
        }
    </script>
</body>
</html>
