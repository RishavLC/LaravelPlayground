<!DOCTYPE html>
<html lang="en">
<head>

    <title>Flex</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

        <div>1</div>

        <div>3</div>

        <h1 class="p-2 border border-dark">2</h1>

        <ul class="d-flex gap-1 list-unstyled border border-dark p-2 m-0">
            <li class="p-2 border border-dark">Home</li>
            <li class="p-2 border border-dark">About</li>
            <li class="p-2 border border-dark">Contact</li>
