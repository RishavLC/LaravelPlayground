<!-- 
🔥 Mini Practice For You

Make this:

1 container

1 row

3 cards side by side

Each card has:

Title

Text

Button -->

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cards</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-3">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="card-title">Card 1</h2>
                            <p class="card-text">This is the first card.</p>
                            <button class="btn btn-primary">Button 1</button>
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="card border border-dark bg-success">
                        <div class="card-body">
                            <h2 class="card-title">Card 2</h2>
                            <p class="card-text">This is the second card.</p>
                            <button class="btn btn-secondary">Button 2</button>
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="card border border-danger bg-warning">
                        <div class="card-body m-4 bg-success">
                            <h2 class="card-title border m-3">Card 3</h2>
                            <p class="card-text text-info">
                                This is the third card.
                            </p>
                            <button class="btn btn-outline-danger">
                                Button 2
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-3">
                    <div class="card border border-secondary">
                        <div class="card-body bg-light">
                            <h2 class="card-title text-primary">Card 3</h2>
                            <p class="card-text">This is the third card.</p>
                            <button class="btn btn-danger">
                                Button
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
