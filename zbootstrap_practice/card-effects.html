<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Cards</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        />
        <style>
            .card:hover{
                transition: 0.3s;
                transform: scale(1.05);
            }
        </style>
    </head>
    <body>
        <div class="container mt-3">
            <div class="row g-3"> <!-- g-3 is used to give gap between the cards -->
                <div class="col-md-4">
                    <div class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title">Card 1</h2>
                            <p class="card-text">This is the first card.</p>
                            <button class="btn btn-primary">Button 1</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card ht-100">
                        <div class="card-body">
                            <h2 class="card-title">Card 2</h2>
                            <p class="card-text">This is the second card.</p>
                            <button class="btn btn-success">Button 2</button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card ht-100">
                        <div class="card-body">
                            <h2 class="card-title">Card 3</h2>
                            <p class="card-text">This is the third card.</p>
                            <button class="btn btn-warning">Button 3</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
